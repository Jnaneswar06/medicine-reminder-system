# Server Configuration
server.port=8080

# Application Name
spring.application.name=medicine-reminder

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medicine_reminder_db}

# Security & JWT Configuration
# Secret key for JWT signing (Minimum 256 bits for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.jnaneswar.medicinereminder=INFO
logging.level.org.springframework.security=INFO
